name: Native Mobile Builds

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'src/**'
      - 'public/**'
      - 'resources/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/native-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/native-mobile.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  android-debug-apk:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Build verified web app
        run: npm run build

      - name: Generate Capacitor Android project
        run: node scripts/ensure-cap-platform.mjs android

      - name: Prepare native Android assets and permissions
        run: |
          node scripts/build-icons.mjs
          npm run native:permissions
          npm run native:adhan

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: salliha-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator-app:
    name: iOS Simulator App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build verified web app
        run: npm run build

      - name: Generate Capacitor iOS project
        run: node scripts/ensure-cap-platform.mjs ios

      - name: Prepare native iOS assets and permissions
        run: |
          node scripts/build-icons.mjs
          npm run native:permissions
          npm run native:adhan

      - name: Sync web assets to iOS
        run: npx cap sync ios

      - name: Build iOS Simulator app without code signing
        run: |
          # Capacitor 8 generates the iOS project with Swift Package Manager
          # (CapApp-SPM/Package.swift), not CocoaPods, so there is no
          # App.xcworkspace — only App.xcodeproj. Build the project directly.
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator app
        run: |
          APP_PATH="build/ios/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" salliha-ios-simulator-app.zip

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: salliha-ios-simulator-app
          path: salliha-ios-simulator-app.zip
          if-no-files-found: error
          retention-days: 14
