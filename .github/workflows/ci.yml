name: Salliha CI

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build generated data
        run: npm run data:build

      - name: Validate Quran
        run: npm run validate:quran

      - name: Validate data
        run: npm run validate:data

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build package
        run: npm run build
